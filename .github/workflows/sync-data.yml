# Refreshes the launch snapshot from Launch Library 2 once a day (see docs/adr/0001-data-source.md).
# Vercel deploys production from `main`, so the snapshot is committed there; `felipejuaneda`
# (the GitHub default branch, which hosts this schedule) is kept in step when it can fast-forward.
name: Sync launch data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- public/data; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "downrange-sync"
          git config user.email "downrange-sync@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): sync launch snapshot"
          git push origin HEAD:main
          git push origin HEAD:felipejuaneda || echo "felipejuaneda has diverged; left as is."
