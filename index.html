<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f3ec" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Downrange — the SpaceX flight record</title>
    <meta property="og:site_name" content="Downrange" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Downrange — the SpaceX flight record" />
    <meta
      property="og:description"
      content="Every SpaceX flight since 2006 on one continuous strip chart. An unofficial explorer."
    />
    <meta property="og:url" content="https://space-x-silk-psi.vercel.app/" />
    <meta property="og:image" content="https://space-x-silk-psi.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preconnect"
      href="https://thespacedevs-prod.nyc3.digitaloceanspaces.com"
      crossorigin
    />
    <!-- The display face sets the countdown and headings; loading it early avoids a late reflow. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Most pages read the launch index; start fetching it alongside the app bundle. -->
    <link rel="preload" href="/data/launches.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/meta.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
